version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Usamos 'npm ci' (Clean Install) para asegurar instalaciones más rápidas 
        # y determinísticas, lo cual reduce el riesgo de que AWS termine el proceso.
        - npm ci 
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*